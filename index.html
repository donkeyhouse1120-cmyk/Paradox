<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Paradox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f1117;--surf:#1a1d27;--surf2:#222536;--bord:#2a2d3e;
  --acc:#7c6aff;--acc2:#9b8dff;--adim:rgba(124,106,255,.13);
  --txt:#e8eaf0;--mut:#6b7280;--dim:#9ca3af;
  --red:#ef4444;--grn:#22c55e;--yel:#fbbf24;
  --r:12px;--rs:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:'Inter',-apple-system,sans-serif;
  color:var(--txt);overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}

/* ═══ LOADING ═══ */
#LS{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#LS.out{opacity:0;pointer-events:none}#LS.gone{display:none}
.ls-logo{font-size:13px;font-weight:700;letter-spacing:5px;text-transform:uppercase;
  color:var(--mut);margin-bottom:32px}.ls-logo b{color:var(--acc)}
#bcanvas{border-radius:10px;margin-bottom:14px;display:block}
.ls-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);
  text-align:right;width:300px;margin-bottom:5px}
.ls-bg{width:300px;height:2px;background:var(--bord);border-radius:99px;
  overflow:hidden;margin-bottom:18px}
.ls-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:99px;transition:width .2s ease}
.ls-log{width:300px;height:80px;overflow:hidden;position:relative}
.ls-log::before{content:'';position:absolute;top:0;left:0;right:0;height:22px;
  background:linear-gradient(var(--bg),transparent);z-index:1;pointer-events:none}
.lsi{display:flex;flex-direction:column;gap:3px;padding-top:2px}
.al{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mut);
  display:flex;align-items:center;gap:7px;animation:lf .15s ease-out;white-space:nowrap}
@keyframes lf{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}
.al.done{color:var(--dim)}.al.act{color:var(--acc2)}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot.done{background:var(--grn)}.dot.act{background:var(--acc);animation:dp .8s infinite}
@keyframes dp{0%,100%{opacity:1}50%{opacity:.25}}
.ams{margin-left:auto;color:var(--mut);opacity:.55;font-size:10px}

/* ═══ LOADER ANIMATION PICKER ═══ */
.ls-anim-row{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.ls-anim-btn{background:var(--surf);border:1.5px solid var(--bord);color:var(--mut);
  font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 11px;border-radius:99px;
  cursor:pointer;transition:all .15s}
.ls-anim-btn:hover{border-color:var(--acc2);color:var(--dim)}
.ls-anim-btn.act{background:var(--adim);border-color:var(--acc);color:var(--acc2)}

/* ═══ HYPE MESSAGE ═══ */
.ls-hype{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acc2);
  text-align:center;width:300px;min-height:16px;margin-bottom:10px;
  animation:hf .3s ease-out;letter-spacing:.3px}
@keyframes hf{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ═══ AUTH SCREENS ═══ */
.auth-wrap{position:fixed;inset:0;background:var(--bg);display:none;
  align-items:center;justify-content:center;z-index:800}
.auth-wrap.vis{display:flex}
.auth-card{background:var(--surf);border:1px solid var(--bord);border-radius:20px;
  padding:44px 40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.auth-logo{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
.auth-logo span{color:var(--acc)}
.auth-sub{font-size:13px;color:var(--mut);margin-bottom:32px}
.auth-tabs{display:flex;gap:0;border:1px solid var(--bord);border-radius:var(--rs);
  overflow:hidden;margin-bottom:28px}
.auth-tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:500;
  color:var(--mut);cursor:pointer;transition:all .15s;border:none;
  background:transparent;font-family:inherit}
.auth-tab.act{background:var(--acc);color:#fff}
.afield{margin-bottom:16px}
.afield label{display:block;font-size:11px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.ainp{width:100%;background:var(--bg);border:1.5px solid var(--bord);color:var(--txt);
  font-family:inherit;font-size:14px;padding:11px 13px;border-radius:var(--rs);
  outline:none;transition:border-color .2s}
.ainp:focus{border-color:var(--acc)}
.ainp::placeholder{color:var(--mut)}
.avrow{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.avprev{width:58px;height:58px;border-radius:50%;background:var(--surf2);
  border:2px dashed var(--bord);display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;overflow:hidden;flex-shrink:0;transition:border-color .2s;position:relative}
.avprev:hover{border-color:var(--acc)}
.avprev .ovl{position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  opacity:0;transition:opacity .15s}
.avprev:hover .ovl{opacity:1}
#avf{display:none}
.aerr{font-size:12px;color:var(--red);margin-bottom:12px;display:none;
  padding:8px 12px;background:rgba(239,68,68,.08);border-radius:var(--rs);
  border:1px solid rgba(239,68,68,.2)}
.abtn{width:100%;background:var(--acc);color:#fff;border:none;font-family:inherit;
  font-size:14px;font-weight:600;padding:12px;border-radius:var(--rs);
  cursor:pointer;transition:background .2s,transform .1s;margin-top:4px}
.abtn:hover{background:var(--acc2)}.abtn:active{transform:scale(.98)}
.abtn:disabled{opacity:.5;cursor:not-allowed}

/* ═══ APP SHELL ═══ */
#APP{display:none;height:100vh;grid-template-columns:250px 1fr}
#APP.vis{display:grid}

/* ═══ SIDEBAR ═══ */
.sb{background:var(--surf);border-right:1px solid var(--bord);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sbh{padding:0 14px;height:52px;border-bottom:1px solid var(--bord);
  display:flex;align-items:center;justify-content:space-between}
.sbh-name{font-size:15px;font-weight:700;letter-spacing:-.3px}
.sbh-name span{color:var(--acc)}
.sbh-status{width:8px;height:8px;border-radius:50%;background:var(--grn)}
.sb-sec{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.9px;padding:14px 14px 5px;display:flex;align-items:center;
  justify-content:space-between}
.chl{list-style:none;padding:0 6px}
.chi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--rs);
  cursor:pointer;font-size:13px;color:var(--mut);transition:all .15s;user-select:none;
  position:relative}
.chi:hover{background:rgba(255,255,255,.04);color:var(--dim)}
.chi.act{background:var(--adim);color:var(--txt);font-weight:500}
.chi-ico{font-size:14px;width:18px;text-align:center;flex-shrink:0;opacity:.5}
.chi.act .chi-ico{opacity:1}
.chi-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chi-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:99px;flex-shrink:0}

.uls{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bord) transparent;min-height:0}
.ul{padding:0 6px 8px}
.ui{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:var(--rs);
  font-size:12.5px;color:var(--dim)}
.ui.me{color:var(--txt);font-weight:500}
.avw{position:relative;width:28px;height:28px;flex-shrink:0}
.avi{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--surf2)}
.avd{width:8px;height:8px;border-radius:50%;background:var(--grn);
  position:absolute;bottom:-1px;right:-1px;border:2px solid var(--surf)}
.admin-crown{font-size:10px;margin-left:auto}

.sbf{border-top:1px solid var(--bord);padding:10px 12px;
  display:flex;align-items:center;gap:9px}
.favi{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.myi{flex:1;min-width:0}
.myn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mys{font-size:11px;color:var(--grn)}
.signout-btn{background:none;border:none;color:var(--mut);cursor:pointer;
  font-size:16px;padding:4px;border-radius:var(--rs);transition:color .15s}
.signout-btn:hover{color:var(--red)}

/* ═══ MAIN ═══ */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}

/* chat header */
.chd{height:52px;padding:0 18px;border-bottom:1px solid var(--bord);
  background:var(--surf);display:flex;align-items:center;gap:8px;flex-shrink:0}
.chd-ico{font-size:16px;color:var(--mut)}
.chd-name{font-size:14px;font-weight:600}
.chd-sep{width:1px;height:16px;background:var(--bord);margin:0 4px}
.chd-desc{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cst{margin-left:auto;font-size:10px;padding:3px 9px;border-radius:99px;font-weight:600;flex-shrink:0}
.cst.on{background:rgba(34,197,94,.1);color:var(--grn)}
.cst.ing{background:rgba(251,191,36,.1);color:var(--yel)}
.cst.off{background:rgba(239,68,68,.1);color:var(--red)}

/* messages */
.msgs{flex:1;overflow-y:auto;padding:12px 0 6px;
  scrollbar-width:thin;scrollbar-color:var(--bord) transparent}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--bord);border-radius:4px}
.mg{display:flex;gap:10px;padding:4px 16px;transition:background .1s;animation:min .16s ease-out}
.mg:hover{background:rgba(255,255,255,.02)}
@keyframes min{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.mg-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;
  background:var(--surf2);margin-top:1px}
.mg-body{flex:1;min-width:0}
.mg-meta{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.mg-name{font-size:13px;font-weight:600}
.mg-name.me{color:var(--acc)}
.mg-name.admin{color:var(--yel)}
.mg-time{font-size:10.5px;color:var(--mut)}
.mg-crown{font-size:10px;margin-left:2px}
.mg-txt{font-size:13.5px;line-height:1.55;color:var(--dim);word-break:break-word}
.sys-msg{text-align:center;padding:6px 16px;font-size:11.5px;color:var(--mut);
  display:flex;align-items:center;gap:10px}
.sys-msg::before,.sys-msg::after{content:'';flex:1;height:1px;background:var(--bord)}
.date-div{padding:14px 16px 6px;font-size:10px;font-weight:700;color:var(--mut);
  text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:10px}
.date-div::before,.date-div::after{content:'';flex:1;height:1px;background:var(--bord)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:8px;color:var(--mut);font-size:13px}
.empty-ico{font-size:42px;opacity:.3;margin-bottom:4px}

/* news banner */
.news-banner{background:linear-gradient(135deg,rgba(124,106,255,.15),rgba(155,141,255,.08));
  border-bottom:1px solid rgba(124,106,255,.2);padding:10px 18px;
  display:flex;align-items:center;gap:10px;flex-shrink:0}
.news-badge{background:var(--acc);color:#fff;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:99px;flex-shrink:0}
.news-txt{font-size:12.5px;color:var(--dim);flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.news-close{background:none;border:none;color:var(--mut);cursor:pointer;
  font-size:14px;padding:0 2px;transition:color .15s;flex-shrink:0}
.news-close:hover{color:var(--txt)}

/* input */
.inpw{padding:8px 16px 14px;flex-shrink:0}
.inpb{background:var(--surf2);border:1.5px solid var(--bord);border-radius:10px;
  display:flex;align-items:center;gap:8px;padding:3px 3px 3px 13px;transition:border-color .2s}
.inpb:focus-within{border-color:var(--acc)}
.ci{flex:1;background:none;border:none;color:var(--txt);font-family:inherit;
  font-size:13.5px;outline:none;padding:8px 0}
.ci::placeholder{color:var(--mut)}.ci:disabled{opacity:.4;cursor:not-allowed}
.sndb{background:var(--acc);color:#fff;border:none;border-radius:8px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s,transform .1s;flex-shrink:0}
.sndb:hover{background:var(--acc2)}.sndb:active{transform:scale(.92)}

/* ═══ GAMES ═══ */
#GLP{display:none;flex:1;overflow:hidden;flex-direction:column}
#GLP.vis{display:flex}
.glp-head{padding:22px 22px 14px;border-bottom:1px solid var(--bord)}
.glp-t{font-size:18px;font-weight:700;margin-bottom:3px}
.glp-s{font-size:12px;color:var(--mut)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:12px;padding:18px 22px;overflow-y:auto;align-content:start}
.gc{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  padding:18px 14px;cursor:pointer;transition:all .2s;text-align:center}
.gc:hover{border-color:var(--acc);background:var(--adim);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(124,106,255,.15)}
.gc .gi{font-size:36px;margin-bottom:9px;display:block}
.gc .gn{font-size:13px;font-weight:600;margin-bottom:3px}
.gc .gd{font-size:11px;color:var(--mut)}

/* game active */
#GA{display:none;flex:1;flex-direction:column;overflow:hidden}
#GA.vis{display:flex}
.ga-head{height:52px;padding:0 16px;border-bottom:1px solid var(--bord);
  background:var(--surf);display:flex;align-items:center;gap:12px;flex-shrink:0}
.ga-back{background:var(--surf2);border:1px solid var(--bord);color:var(--dim);
  padding:5px 12px;border-radius:var(--rs);cursor:pointer;font-family:inherit;
  font-size:12px;font-weight:500;transition:all .15s}
.ga-back:hover{border-color:var(--acc);color:var(--acc)}
.ga-title{font-size:14px;font-weight:600}
.ga-score{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc)}
#GF{flex:1;display:flex;align-items:center;justify-content:center;
  padding:16px;background:var(--bg);overflow:hidden;position:relative}

/* ═══ ADMIN PANEL ═══ */
#ADMIN{display:none;flex:1;overflow:hidden;flex-direction:column}
#ADMIN.vis{display:flex}
.adm-head{height:52px;padding:0 18px;border-bottom:1px solid var(--bord);
  background:var(--surf);display:flex;align-items:center;gap:10px;flex-shrink:0}
.adm-head-title{font-size:14px;font-weight:600}
.adm-crown{font-size:16px}
.adm-body{display:flex;flex:1;overflow:hidden}
.adm-nav{width:180px;border-right:1px solid var(--bord);background:var(--surf);
  padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.adm-nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-radius:var(--rs);cursor:pointer;font-size:13px;color:var(--mut);transition:all .15s}
.adm-nav-item:hover{background:rgba(255,255,255,.04);color:var(--dim)}
.adm-nav-item.act{background:var(--adim);color:var(--txt);font-weight:500}
.adm-content{flex:1;overflow-y:auto;padding:22px;scrollbar-width:thin;
  scrollbar-color:var(--bord) transparent}
.adm-section{display:none}.adm-section.vis{display:block}
.adm-title{font-size:16px;font-weight:700;margin-bottom:4px}
.adm-sub{font-size:12px;color:var(--mut);margin-bottom:20px}
.adm-card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  padding:18px;margin-bottom:14px}
.adm-card-title{font-size:13px;font-weight:600;margin-bottom:12px}
.adm-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.adm-label{font-size:12px;color:var(--dim);width:120px;flex-shrink:0}
.adm-inp{flex:1;background:var(--bg);border:1.5px solid var(--bord);color:var(--txt);
  font-family:inherit;font-size:13px;padding:8px 11px;border-radius:var(--rs);outline:none;
  transition:border-color .2s}
.adm-inp:focus{border-color:var(--acc)}
.adm-color{width:40px;height:34px;border:1.5px solid var(--bord);border-radius:var(--rs);
  cursor:pointer;background:none;padding:2px}
.adm-btn{background:var(--acc);color:#fff;border:none;font-family:inherit;
  font-size:13px;font-weight:600;padding:8px 16px;border-radius:var(--rs);
  cursor:pointer;transition:background .15s}
.adm-btn:hover{background:var(--acc2)}
.adm-btn.danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.adm-btn.danger:hover{background:rgba(239,68,68,.25)}
.adm-btn.sm{font-size:11px;padding:5px 10px}
.adm-textarea{width:100%;background:var(--bg);border:1.5px solid var(--bord);color:var(--txt);
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 12px;
  border-radius:var(--rs);outline:none;resize:vertical;min-height:100px;
  transition:border-color .2s;line-height:1.5}
.adm-textarea:focus{border-color:var(--acc)}
.user-row{display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:var(--rs);background:var(--bg);margin-bottom:6px}
.user-row-av{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0}
.user-row-name{flex:1;font-size:13px;font-weight:500}
.user-row-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600}
.badge-admin{background:rgba(251,191,36,.15);color:var(--yel)}
.badge-blocked{background:rgba(239,68,68,.15);color:var(--red)}
.badge-user{background:rgba(107,114,128,.15);color:var(--mut)}
.news-row{background:var(--bg);border-radius:var(--rs);padding:12px;margin-bottom:8px}
.news-row-title{font-size:13px;font-weight:600;margin-bottom:3px}
.news-row-meta{font-size:11px;color:var(--mut)}
.ai-prompt-wrap{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.ai-prompt-inp{flex:1;background:var(--bg);border:1.5px solid var(--acc);color:var(--txt);
  font-family:inherit;font-size:13px;padding:9px 13px;border-radius:var(--rs);
  outline:none;resize:none;min-height:38px;max-height:100px;line-height:1.5;
  transition:border-color .2s}
.ai-prompt-inp:focus{border-color:var(--acc2)}
.ai-prompt-inp::placeholder{color:var(--mut)}
.ai-gen-btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  border:none;font-family:inherit;font-size:12px;font-weight:600;padding:9px 14px;
  border-radius:var(--rs);cursor:pointer;white-space:nowrap;transition:opacity .2s;flex-shrink:0}
.ai-gen-btn:hover{opacity:.85}.ai-gen-btn:disabled{opacity:.45;cursor:not-allowed}
.ai-gen-btn.loading{animation:aipulse 1s infinite}
@keyframes aipulse{0%,100%{opacity:.6}50%{opacity:1}}
.ai-label{font-size:11px;color:var(--acc2);font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.code-editor{width:100%;background:#0a0c10;border:1.5px solid var(--bord);color:#c4bbff;
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:14px;
  border-radius:var(--rs);outline:none;resize:vertical;min-height:200px;
  line-height:1.6;tab-size:2}
.code-editor:focus{border-color:var(--acc)}
.exec-out{background:#0a0c10;border:1px solid var(--bord);border-radius:var(--rs);
  padding:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  color:#c4bbff;min-height:60px;max-height:200px;overflow-y:auto;white-space:pre-wrap;
  margin-top:10px;line-height:1.5}
.swatch-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.swatch-label{font-size:12px;color:var(--dim);width:130px}
.theme-chip{background:var(--bg);border:1px solid var(--bord);border-radius:var(--rs);
  padding:8px 10px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:8px}
.theme-chip:hover{border-color:var(--acc);background:var(--adim)}
